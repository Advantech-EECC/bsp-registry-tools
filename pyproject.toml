[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsp-registry-tools"
version = "2.2.0"
description = "Advantech Board Support Package (BSP) Registry Manager"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Advantech", email = "mikhail.tsukerman@advantech.com"},
]
keywords = ["yocto", "bsp", "embedded", "linux", "build-system", "advantech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "PyYAML>=6.0",
    "dacite>=1.6.0",
    "kas>=4.7",
    "colorama>=0.4.6",
    "requests>=2.28.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "strawberry-graphql[fastapi]>=0.200.0",
]
azure = [
    "azure-storage-blob>=12.0",
    "azure-identity>=1.0",
]
aws = [
    "boto3>=1.20",
]
deploy = [
    "azure-storage-blob>=12.0",
    "azure-identity>=1.0",
    "boto3>=1.20",
]
gui = [
    "textual>=8.0.0",
    # Provides the in-process web server used by 'bsp-explorer-web'.
    "textual-serve>=1.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "bsp-registry-tools[gui]",
]
completions = [
    "argcomplete>=3.0",
]
mcp = [
    # MCP SDK requires Python 3.10+; the rest of the package keeps 3.8 support.
    # 1.28.1 is the first release without known advisories.
    "mcp>=1.28.1; python_version >= '3.10'",
]
report = [
    # 62.0 is the first release with usable flex/grid handling; the PDF report
    # also relies on target-counter() and @page margin boxes.
    "weasyprint>=62.0",
]
# flash: intentionally empty — bmaptool is a system package, not a Python package.
# Install it separately:  sudo apt install bmap-tools
# or from PyPI:           pip install bmaptool
# This extra exists solely to document the system dependency.
flash = []

[project.scripts]
bsp = "bsp.cli:main"
bsp-explorer = "bsp.gui:main"
bsp-explorer-web = "bsp.gui:main_web"
bsp-mcp = "bsp.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Advantech-EECC/bsp-registry-tools"
Repository = "https://github.com/Advantech-EECC/bsp-registry-tools"
Issues = "https://github.com/Advantech-EECC/bsp-registry-tools/issues"

[tool.setuptools]
packages = ["bsp", "bsp.server", "bsp.storage", "bsp.mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
